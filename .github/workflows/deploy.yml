name: Build and Deploy Resume

on:
  push:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV-Fikri_Hidayatulloh.tex

      - name: Prepare Deployment Folder & HTML Wrapper
        run: |
          mkdir -p public
          cp CV-Fikri_Hidayatulloh.pdf public/CV-Fikri_Hidayatulloh.pdf
          
          # 1. Membuat Timestamp unik (detik saat ini) untuk memecah cache
          TIMESTAMP=$(date +%s)
          
          # 2. Membuat file index.html yang lebih cerdas
          # Ini menggunakan IFRAME untuk preview desktop
          # Dan menambahkan parameter ?v=timestamp agar HP download file BARU
          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CV - Muhammad Fikri Hidayatulloh</title>
            <style>
              body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #525659; font-family: sans-serif; }
              .pdf-container { width: 100%; height: 100%; }
              iframe { width: 100%; height: 100%; border: none; }
              
              /* Tampilan khusus HP jika iframe gagal load */
              .mobile-fallback { 
                 display: none; 
                 position: absolute; 
                 top: 50%; left: 50%; 
                 transform: translate(-50%, -50%); 
                 text-align: center; 
                 color: white;
              }
              
              @media (max-width: 768px) {
                 /* Di HP, kita tetap coba tampilkan iframe, tapi siapkan fallback */
                 .mobile-fallback { display: block; z-index: -1; } 
              }
            </style>
          </head>
          <body>
            <div class="pdf-container">
              <iframe src="CV-Fikri_Hidayatulloh.pdf?v=$TIMESTAMP" title="CV Preview">
              </iframe>
            </div>
            
            <div class="mobile-fallback">
               <p>Preview loading...</p>
               <p>If not appearing, <a href="CV-Fikri_Hidayatulloh.pdf?v=$TIMESTAMP" style="color: #4da6ff;">Click here to view/download</a></p>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages